<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LIAANCORE</title>
    
    <style>
        :root {
            color-scheme: dark;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ededed;
            font-family: 'Momo Trust Display', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-box {
            background-color: #09090b;
            border: 1px solid #27282b;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 400px;
            padding: 40px 32px;
            box-sizing: border-box;
            margin: 20px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin: 0;
            letter-spacing: -0.5px;
            font-weight: 600;
        }

        .auth-header p {
            color: #a0a0ad;
            font-size: 0.9em;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.85em;
            color: #a0a0ad;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            background-color: #000000;
            border: 1px solid #27282b;
            color: #ffffff;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.2s;
            font-family: inherit;
            font-size: 0.95em;
        }

        .form-input:focus {
            outline: none;
            border-color: #4a4a52;
        }

        .btn-submit {
            background-color: #ededed;
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            font-size: 0.95em;
            font-weight: 600;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background-color: #ffffff;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }
        
        .error-message {
            background-color: rgba(239, 68, 68, 0.05); /* Vermelho muito sutil */
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444; /* Vermelho do seu status-O */
            padding: 12px;
            margin-bottom: 24px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .auth-links {
            text-align: center;
            margin-top: 24px;
        }

        .auth-links a {
            color: #a0a0ad;
            text-decoration: none;
            font-size: 0.85em;
            transition: color 0.2s;
        }
        
        .auth-links a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="auth-box">
        <div class="auth-header">
            <h1>liaancore</h1>
            <p>Acesse o painel do laboratório (LIAAN)</p>
        </div>
        
        {% if form.errors %}
            <div class="error-message">
                Credenciais inválidas. Verifique seu usuário e senha.
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username">Usuário</label>
                <input type="text" name="username" id="id_username" class="form-input" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="id_password">Senha</label>
                <input type="password" name="password" id="id_password" class="form-input" required>
            </div>
            
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            
            <button type="submit" class="btn-submit">Entrar</button>
        </form>
        
        <div class="auth-links">
            <a href="{% url 'mapeamento:signup' %}">Não tem uma conta? Solicite acesso</a>
        </div>
    </div>

</body>
</html>
