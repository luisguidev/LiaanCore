<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LIAANCORE</title>
    
    <style>
        :root {
            color-scheme: dark;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ededed;
            font-family: 'Momo Trust Display', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-box {
            background-color: #000000;
            border: none;
            width: 100%;
            max-width: 360px; /* Reduzido levemente para dar margem em telas finas */
            padding: 40px 24px; /* Ajuste de padding para segurança lateral */
            box-sizing: border-box;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
        }

        .auth-header h1 {
            color: #ffffff;
            font-size: 2rem;
            margin: 0 auto;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            font-weight: 700;
            /* O segredo da centralização: compensar o letter-spacing na esquerda */
            padding-left: 0.35em; 
            display: inline-block;
        }

        .auth-header p {
            color: #a0a0ad;
            font-size: 0.9em;
            margin-top: 12px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-input {
            width: 100%;
            padding: 16px 4px;
            background-color: #000000;
            border: none;
            border-bottom: 1px solid #27282b;
            color: #ffffff;
            border-radius: 0;
            box-sizing: border-box;
            transition: border-color 0.2s;
            font-family: inherit;
            font-size: 1rem;
        }

        .form-input:focus {
            outline: none;
            border-color: #ededed;
        }

        .form-input::placeholder {
            color: #a0a0ad;
            opacity: 1;
        }

        .btn-submit {
            background-color: #ededed;
            color: #000000;
            border: none;
            padding: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 16px;
        }

        .btn-submit:hover {
            background-color: #ffffff;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }
        
        .error-message {
            background-color: rgba(239, 68, 68, 0.05);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 12px;
            margin-bottom: 24px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .auth-links {
            text-align: center;
            margin-top: 32px;
        }

        .auth-links a {
            color: #ededed;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 500;
            transition: color 0.2s;
            border-bottom: 1px solid transparent;
            padding-bottom: 2px;
        }
        
        .auth-links a:hover {
            border-bottom-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="auth-box">
        <div class="auth-header">
            <h1>liaancore</h1>
            <p>Acesse o painel do laboratório (LIAAN)</p>
        </div>
        
        {% if form.errors %}
            <div class="error-message">
                {% if form.non_field_errors %}
                    {% for error in form.non_field_errors %}
                        {{ error }}
                    {% endfor %}
                {% else %}
                    Usuário ou senha incorretos.
                {% endif %}
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <input type="text" name="username" id="id_username" class="form-input" placeholder="Usuário" required autofocus>
            </div>
            
            <div class="form-group">
                <input type="password" name="password" id="id_password" class="form-input" placeholder="Senha" required>
            </div>
            
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            
            <button type="submit" class="btn-submit">Entrar</button>
        </form>
        
        <div class="auth-links">
            <a href="{% url 'mapeamento:signup' %}">Não tem uma conta? Cadastre-se</a>
        </div>
    </div>

</body>
</html>
